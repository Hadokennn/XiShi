[project]
name = "xishi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.100.0",
    "fastapi>=0.136.1",
    "openai>=2.36.0",
    "pydantic-settings>=2.14.1",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xishi"]

[project.scripts]
xishi = "xishi.cli:app"

[dependency-groups]
dev = []
